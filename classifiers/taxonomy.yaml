# Every scene a photo can be sorted into. `core: true` marks the 10 categories measured against
# the 85% target. Bedrooms count as Home, hills as Mountains, and selfies as People.
#
# To add a category, see classifiers/README.md. `documents` is decided by Apple's on-device
# signals rather than the scene model, and everything uncertain goes to Other.
version: 2
groups:
  places:
    - { id: cafe, label: "Cafés", core: true }
    - { id: restaurant, label: "Restaurants" }
    - { id: food, label: "Food", core: true }
    - { id: home, label: "Home", core: true }
    - { id: office, label: "Work" }
    - { id: gym, label: "Gym" }
    - { id: mountains, label: "Mountains", core: true }
    - { id: beach, label: "Beach", core: true }
    - { id: lake, label: "Lakes and rivers" }
    - { id: forest, label: "Forest" }
    - { id: desert, label: "Desert" }
    - { id: snow, label: "Snow" }
    - { id: city-street, label: "City streets", core: true }
    - { id: night-city, label: "City at night", core: true }
    - { id: market, label: "Markets" }
    - { id: temple, label: "Temples" }
    - { id: museum, label: "Museums" }
  transport:
    - { id: flight, label: "Flights", core: true }
    - { id: railway-station, label: "Railway stations", core: true }
    - { id: train, label: "On the train" }
    - { id: metro, label: "Metro", core: true }
    - { id: road-trip, label: "Road trips" }
    - { id: bike, label: "Bikes" }
  people:
    - { id: group, label: "People" }
    - { id: pets, label: "Pets" }
  other:
    - { id: sky, label: "Skies and sunsets" }
    - { id: event, label: "Concerts and events" }
    - { id: documents, label: "Screenshots and documents", exclude_by_default: true }
