name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Lint, typecheck, unit tests, schema and Swift round-trip tests, licence scan.
      - run: pnpm check
      - run: pnpm --filter @u-cut/site build
      - run: swift build --package-path apps/mac
      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "origin/${{ github.base_ref }}"

  # Runs on the newest Node, which is what Homebrew gives people. `checks` covers the oldest.
  reels:
    runs-on: macos-15
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: brew install ffmpeg
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node packages/engine/dist/bin.js setup
      - run: swift build --package-path apps/mac -c release --product ucut-vision
      - name: Real reels, messy phone media, every template
        run: pnpm test:int
      - name: Make a reel with the network blocked
        run: pnpm test:privacy
      - name: Click through the app in a real browser
        timeout-minutes: 14
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: pnpm test:e2e 2>&1 | tee e2e.log; status=${PIPESTATUS[0]}; [ "$status" -eq 0 ] || { tail -6 e2e.log | while IFS= read -r line; do echo "::error::$line"; done; exit "$status"; }
      - name: Five people at once
        run: pnpm load-test --users 5 --seconds 3

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t u-cut .
      - name: Make a reel inside the container
        run: |
          set +e
          docker run --rm -v "$PWD/out:/out" u-cut \
            node packages/engine/dist/bin.js make library/samples -o /out/reel.mp4 \
            --duration 15 --quality draft > make.log 2>&1
          status=$?
          cat make.log
          if [ "$status" -ne 0 ]; then
            # Logs need a login, but annotations are public, so the reason can be read by anyone.
            tail -6 make.log | cut -c1-400 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          test -s out/reel.mp4
          docker run --rm -v "$PWD/out:/out" u-cut \
            ffmpeg -hide_banner -nostats -i /out/reel.mp4 -af ebur128 -f null - 2>&1 |
            sed -n '/Summary:/,$p' | tee loudness.log
          loudness="$(sed -n 's/ *I: *\(-[0-9.]*\) LUFS/\1/p' loudness.log)"
          echo "::notice::A full reel on Linux measures $loudness LUFS"
          awk -v value="$loudness" 'BEGIN { exit !(value > -15.5 && value < -12.5) }'
      - name: Serve the interface from the container
        run: |
          docker run -d --name ucut -p 4173:4173 u-cut
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:4173/api/status && break
            sleep 1
          done
          curl -fsS http://localhost:4173/ | grep -q '<div id="app">'
