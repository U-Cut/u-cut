name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Lint, typecheck, unit tests, schema and Swift round-trip tests, licence scan.
      - run: pnpm check
      - run: swift build --package-path apps/mac
      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "origin/${{ github.base_ref }}"
